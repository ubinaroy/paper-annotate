<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论文批注</title>
<style>
:root {
  --bg: #f5f5f3; --panel: #ffffff; --ink: #1d1d1f; --ink2: #55555b; --ink3: #8b8b91;
  --line: #e3e3e0; --soft: #f0f0ed; --viewer: #e4e4e0; --accent: #2f6fde; --accent-soft: rgba(47,111,222,.12);
  --err: #c7362f; --ok: #2a8a55;
  --open: #d99a00; --open-hl: rgba(255,190,0,.34);
  --done: #2a9d5c; --done-hl: rgba(46,170,95,.20);
  --discuss: #7c4ddb; --discuss-hl: rgba(140,90,230,.22);
  --pending-hl: rgba(47,111,222,.26);
  --shadow: 0 1px 3px rgba(0,0,0,.10), 0 6px 18px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1d; --panel: #242427; --ink: #ececee; --ink2: #b0b0b6; --ink3: #7f7f86;
    --line: #36363b; --soft: #2c2c30; --viewer: #141416; --accent: #6b98ff; --accent-soft: rgba(107,152,255,.16);
    --shadow: 0 1px 3px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1d; --panel: #242427; --ink: #ececee; --ink2: #b0b0b6; --ink3: #7f7f86;
  --line: #36363b; --soft: #2c2c30; --viewer: #141416; --accent: #6b98ff; --accent-soft: rgba(107,152,255,.16);
  --shadow: 0 1px 3px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  display: grid; grid-template-rows: auto auto 1fr; overflow: hidden;
}
button, select, textarea { font: inherit; color: inherit; }
button {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 9px;
  cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--ink3); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.ghost { border-color: transparent; background: transparent; color: var(--ink2); }
button.ghost:hover { background: var(--soft); }
button:disabled { opacity: .45; cursor: default; }

/* ---------- top bar ---------- */
#bar {
  display: flex; align-items: center; gap: 10px; padding: 7px 14px; background: var(--panel);
  border-bottom: 1px solid var(--line); min-width: 0;
}
#bar .brand { font-weight: 600; font-size: 14px; }
#bar select { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 6px; }
#roundInfo, #pageInfo { color: var(--ink3); font-size: 12px; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 10px; background: var(--panel); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.zoom { display: inline-flex; align-items: center; gap: 4px; }
.zoom button { padding: 2px 8px; }
#zVal { width: 42px; text-align: center; color: var(--ink2); font-variant-numeric: tabular-nums; }
.grow { flex: 1; }
#saveState { font-size: 12px; color: var(--ink3); white-space: nowrap; }
#saveState.ok { color: var(--ok); }
#saveState.err { color: var(--err); font-weight: 600; }

#banner {
  padding: 7px 14px; background: color-mix(in srgb, var(--accent) 10%, var(--panel)); border-bottom: 1px solid var(--line);
  display: flex; gap: 10px; align-items: center; font-size: 12.5px;
}
#banner[hidden] { display: none; }

main { display: grid; grid-template-columns: minmax(0,1fr) 7px var(--side-w, 390px); min-height: 0; }
#splitter { cursor: col-resize; background: var(--line); position: relative; touch-action: none; }
#splitter::after { content: ""; position: absolute; left: 2px; top: 50%; width: 3px; height: 36px; margin-top: -18px; border-radius: 2px; background: var(--ink3); opacity: .5; }
#splitter:hover, #splitter.drag { background: var(--accent); }
#splitter:hover::after, #splitter.drag::after { background: #fff; opacity: .9; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }

/* ---------- viewer ---------- */
#viewer { overflow: auto; background: var(--viewer); position: relative; }
#pages { position: relative; margin: 0 auto; padding: 22px 24px 60vh; width: max-content; min-width: 100%; }
.page {
  position: relative; margin: 0 auto 22px; background: #fff; box-shadow: var(--shadow);
}
.page .cv, .page .cv canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.page .plabel { position: absolute; top: -17px; right: 0; font-size: 11px; color: var(--ink3); user-select: none; }
.annoLayer, .badgeLayer, .regionLayer { position: absolute; inset: 0; }
.annoLayer { z-index: 1; pointer-events: none; }
.badgeLayer { z-index: 3; pointer-events: none; }
.regionLayer { z-index: 4; pointer-events: none; }
#pages.mode-region .regionLayer { pointer-events: auto; cursor: crosshair; }
#pages.mode-region .textLayer { pointer-events: none; }

/* pdf.js 3.11 text layer (from pdf_viewer.css) */
.textLayer {
  position: absolute; text-align: initial; inset: 0; overflow: hidden; line-height: 1;
  -webkit-text-size-adjust: none; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; z-index: 2;
}
.textLayer span, .textLayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
.textLayer span.markedContent { top: 0; height: 0; }
.textLayer ::selection { background: rgba(47,111,222,.30); }
.textLayer br::selection { background: transparent; }
.textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: -1; cursor: default; user-select: none; }
.textLayer.selecting .endOfContent { top: 0; }

.hl { position: absolute; mix-blend-mode: multiply; border-radius: 2px; }
.hl.st-open { background: var(--open-hl); }
.hl.st-done { background: var(--done-hl); }
.hl.st-discuss { background: var(--discuss-hl); }
.hl.pending { background: var(--pending-hl); }
.hl.region { background: transparent !important; border: 1.6px solid var(--open); mix-blend-mode: normal; border-radius: 3px; }
.hl.region.st-open { background: rgba(255,190,0,.07) !important; }
.hl.region.st-done { border-color: var(--done); }
.hl.region.st-discuss { border-color: var(--discuss); }
.hl.region.pending { border: 1.6px dashed var(--accent); background: rgba(47,111,222,.06) !important; }
.hl.focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.hl.region.focus { outline-offset: 2px; }
.hl.flash { animation: flash 1.1s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 6px rgba(47,111,222,.55); } 100% { box-shadow: 0 0 0 0 rgba(47,111,222,0); } }

.badge {
  position: absolute; pointer-events: auto; transform: translate(-50%, -50%);
  min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; border: 0;
  font: 600 11px/19px -apple-system, "PingFang SC", sans-serif; color: #fff; background: var(--open);
  box-shadow: 0 1px 2px rgba(0,0,0,.25); text-align: center; cursor: pointer;
}
.badge.st-done { background: var(--done); }
.badge.st-discuss { background: var(--discuss); }
.badge.focus { background: var(--accent); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent); }

/* ---------- composer ---------- */
.composer {
  position: absolute; z-index: 20; width: 360px; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.12);
  padding: 10px 11px 9px;
}
.composer[hidden] { display: none; }
.cHead { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
.cHead b { font-size: 12.5px; }
.cHead .meta { color: var(--ink3); font-size: 11.5px; }
.cHead .hint { margin-left: auto; color: var(--ink3); font-size: 11px; }
.quote {
  border-left: 3px solid var(--line); padding: 1px 0 1px 8px; color: var(--ink2); font-size: 12px;
  font-family: "Times New Roman", "Songti SC", serif; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
}
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 7px; }
.tag {
  border: 1px solid var(--line); border-radius: 11px; padding: 0 8px; font-size: 11.5px; line-height: 20px; color: var(--ink2);
  background: transparent; cursor: pointer;
}
.tag.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
textarea {
  width: 100%; min-height: 78px; resize: vertical; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px;
  background: var(--panel); line-height: 1.5; outline: none;
}
textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cFoot { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
.cFoot .kbd { color: var(--ink3); font-size: 11px; margin-right: auto; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* ---------- sidebar ---------- */
#side { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.sideHead { padding: 9px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters { display: flex; gap: 2px; flex-wrap: wrap; }
.filters button { border: 0; background: transparent; padding: 2px 7px; border-radius: 5px; color: var(--ink2); font-size: 12px; }
.filters button.on { background: var(--soft); color: var(--ink); font-weight: 600; }
.filters .c { color: var(--ink3); font-weight: 400; margin-left: 3px; font-variant-numeric: tabular-nums; }
#addGlobal { margin-left: auto; font-size: 12px; }
#list { overflow: auto; padding: 8px 10px 30px; }
.empty { color: var(--ink3); padding: 18px 8px; line-height: 1.8; font-size: 12.5px; }
.empty kbd, .help kbd {
  font: 11px/1 ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 1px 4px; background: var(--soft); color: var(--ink2);
}
.group { font-size: 11.5px; color: var(--ink3); margin: 10px 4px 4px; font-weight: 600; letter-spacing: .02em; }
.card {
  border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px 7px; margin: 0 0 7px; background: var(--panel); cursor: pointer;
  position: relative;
}
.card:hover { border-color: var(--ink3); }
.card.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card.deleted { display: none; }
.cardHead { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink3); margin-bottom: 4px; min-width: 0; }
.cardHead .num { color: #fff; background: var(--open); border-radius: 9px; padding: 0 6px; font-weight: 600; line-height: 17px; }
.card.st-done .num { background: var(--done); }
.card.st-discuss .num { background: var(--discuss); }
.cardHead .src { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cardHead .t { color: var(--accent); }
.cardHead .who { color: var(--ink2); font-weight: 600; }
#authorSel { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; font-size: 12px; padding: 1px 4px; color: var(--ink2); }
#importFile { display: none; }
.comment { white-space: pre-wrap; word-break: break-word; margin-top: 5px; font-size: 13px; }
.comment.blank { color: var(--ink3); font-style: italic; }
.reply {
  margin-top: 6px; padding: 5px 8px; border-radius: 6px; background: var(--soft); font-size: 12.5px; white-space: pre-wrap; word-break: break-word;
}
.reply b { color: var(--ink2); font-size: 11.5px; }
.cardFoot { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
.cardFoot .seg button { font-size: 11px; padding: 1px 7px; }
.cardFoot .seg button.on.s-open { color: var(--open); background: rgba(255,190,0,.14); }
.cardFoot .seg button.on.s-done { color: var(--done); background: rgba(46,170,95,.14); }
.cardFoot .seg button.on.s-discuss { color: var(--discuss); background: rgba(140,90,230,.14); }
.cardFoot .ghost { font-size: 11.5px; padding: 1px 6px; }
.cardFoot .sp { flex: 1; }
.sideFoot { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 11.5px; color: var(--ink3); line-height: 1.6; }
.sideFoot code { font: 10.5px ui-monospace, Menlo, monospace; color: var(--ink2); word-break: break-all; }
.help { margin-top: 4px; }

#loading { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); color: var(--ink3); }
#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: #222; color: #fff; padding: 7px 12px; border-radius: 8px; font-size: 12.5px; transition: .18s; z-index: 50;
  display: flex; gap: 10px; align-items: center; max-width: 80vw;
}
#toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
#toast button { background: transparent; color: #9cc0ff; border: 0; padding: 0; font-weight: 600; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 40vh; }
  #splitter { display: none; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  #bar { flex-wrap: wrap; }
}
</style>
</head>
<body>
<header id="bar">
  <span class="brand">论文批注</span>
  <select id="roundSel" title="批注轮次：每轮对应一份 PDF 快照"></select>
  <span id="roundInfo"></span>
  <div class="seg" id="modeSeg">
    <button data-mode="text" class="on" title="点一下 = 整句；拖动 = 任意文字（快捷键 T）">句子 / 文字</button>
    <button data-mode="region" title="拖一个框：图、表、公式、整段（快捷键 R；文字模式下按住 ⌥ 拖动也行）">框选区域</button>
  </div>
  <div class="zoom">
    <button id="zOut" title="缩小：⌘− / 双指捏合 / Ctrl+滚轮">−</button><span id="zVal">100%</span><button id="zIn" title="放大：⌘+ / 双指张开 / Ctrl+滚轮">+</button>
    <button id="zFit" title="适合宽度（⌘0）">适宽</button>
  </div>
  <span id="pageInfo"></span>
  <span class="grow"></span>
  <span id="saveState"></span>
  <button id="authorBtn" class="ghost" title="署名会写进你新建的每条批注">署名：未设置</button>
  <button id="exportBtn" title="把本轮批注导出成文件，发给论文作者">导出</button>
  <button id="importBtn" title="导入别人发来的批注文件，合并进来">导入</button>
  <input id="importFile" type="file" accept=".json,application/json">
  <button id="copyMd" title="把本轮全部批注（Markdown）复制到剪贴板">复制 Markdown</button>
</header>
<div id="banner" hidden></div>
<main>
  <div id="viewer"><div id="pages"></div><div id="loading">加载 PDF…</div></div>
  <div id="splitter" title="拖动调整侧栏宽度；双击恢复默认"></div>
  <aside id="side">
    <div class="sideHead">
      <div class="filters" id="filters"></div>
      <button id="addGlobal" title="不针对某句话的整体意见">+ 整体意见</button>
    </div>
    <div id="list"></div>
    <div class="sideFoot" id="sideFoot"></div>
  </aside>
</main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
"use strict";
const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";

const TAGS = ["改写", "删减", "逻辑", "疑问", "图表", "格式"];
const STATUS = { open: "未处理", done: "已改", discuss: "待讨论" };
const KIND = { sentence: "句子", text: "文字", region: "区域", global: "整体意见" };
const CLIENT_FIELDS = ["n", "kind", "page", "rects", "quote", "ctx", "comment", "tag", "author", "created", "updated", "deleted"];
const SERVER_FIELDS = ["source", "crop", "reply", "reply_at", "reply_by", "_geo"];
const ABBR = new Set(["e.g.", "i.e.", "al.", "fig.", "figs.", "eq.", "eqs.", "tab.", "tabs.", "sec.", "secs.", "vs.", "cf.",
  "resp.", "approx.", "no.", "ref.", "refs.", "app.", "alg.", "ch.", "ex.", "w.r.t.", "i.i.d.", "avg.", "std.", "et."]);

const $ = (s, r = document) => r.querySelector(s);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const pad = (n, w = 2) => String(Math.floor(Math.abs(n))).padStart(w, "0");
function isoNow() {
  const d = new Date(), off = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}${off >= 0 ? "+" : "-"}${pad(off / 60)}:${pad(off % 60)}`;
}
const hhmm = iso => (iso || "").slice(5, 16).replace("T", " ");
const newId = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const S = {
  rounds: [], roundsDir: "", live: null, round: null, pdf: null, pages: [],
  scale: 1.4, fit: true, mode: "text", items: [], focusId: null, editingId: null, filter: "all",
  pending: null, dirty: false, saveT: null, savePromise: null, listStale: false, down: null, clickT: null,
  author: (() => { try { return localStorage.getItem("paper-annotate:author") || ""; } catch { return ""; } })(), who: "",
};
const viewer = $("#viewer"), pagesEl = $("#pages"), listEl = $("#list");

// ------------------------------------------------------------------ boot
async function boot() {
  try {
    const z = JSON.parse(localStorage.getItem("paper-annotate:zoom") || "null");
    if (z) { S.fit = !!z.fit; if (!z.fit && z.scale) S.scale = clamp(z.scale, 0.5, 4); }
  } catch {}
  buildComposer();
  wireUi();
  await loadRounds();
  const q = new URLSearchParams(location.search).get("round");
  let last = null; try { last = localStorage.getItem("paper-annotate:last"); } catch {}
  const pick = [q, last].find(n => n && S.rounds.some(r => r.name === n)) || (S.rounds.at(-1) || {}).name;
  if (!pick) { $("#loading").textContent = "还没有批注轮次：先运行 python3 server.py"; return; }
  await openRound(pick);
  setInterval(poll, 5000);
  setInterval(loadRounds, 20000);
}

async function loadRounds() {
  try {
    const d = await (await fetch("/api/rounds")).json();
    S.rounds = d.rounds || []; S.live = d.live; S.roundsDir = d.rounds_dir || "";
    if (!S.author && d.default_author) { S.author = d.default_author; showAuthor(); }
  } catch { return; }
  const sel = $("#roundSel"), cur = S.round && S.round.name;
  sel.replaceChildren(...S.rounds.map(r => {
    const o = el("option", null, `${r.name.slice(0, 3)} · PDF ${hhmm(r.pdf_mtime)}`); o.value = r.name; return o;
  }));
  if (cur) sel.value = cur;
  updateBanner();
}

async function openRound(name) {
  const meta = S.rounds.find(r => r.name === name);
  if (!meta) return;
  if (S.round && (S.dirty || S.savePromise)) await save();
  closeComposer();
  S.round = meta; S.items = []; S.focusId = null; S.editingId = null;
  history.replaceState(null, "", "?round=" + encodeURIComponent(meta.name));
  try { localStorage.setItem("paper-annotate:last", meta.name); } catch {}
  $("#roundSel").value = meta.name;
  $("#sideFoot").innerHTML = "";
  const foot = $("#sideFoot");
  foot.append("自动保存到 ", el("code", null, `${S.roundsDir}/${meta.name}/annotations.md`), "，可以直接交给 Claude 等 AI 改稿。别人的批注用「导入」合并。");
  const help = el("div", "help");
  help.innerHTML = "<kbd>点击</kbd> 整句 · <kbd>⇧点击</kbd> 延伸 · <kbd>拖选</kbd> 任意文字 · <kbd>R</kbd>/<kbd>⌥拖</kbd> 框区域 · <kbd>J</kbd><kbd>K</kbd> 上下条 · <kbd>⌘↵</kbd> 保存 · 捏合 / <kbd>⌘±</kbd> 缩放";
  foot.append(help);

  pagesEl.replaceChildren(composer);
  if (S.pdf) { S.pdf.destroy(); S.pdf = null; }
  $("#loading").hidden = false; $("#loading").textContent = "加载 PDF…";
  let pdf;
  try {
    pdf = await pdfjsLib.getDocument({ url: `/api/r/${encodeURIComponent(meta.name)}/pdf` }).promise;
  } catch (e) { $("#loading").textContent = "PDF 加载失败：" + e.message; return; }
  if (!meta.page_sizes || !meta.page_sizes.length) {
    // 服务端没有 pdfinfo：用 pdf.js 量页面尺寸，并报给服务端（synctex / 截图要用）
    const sizes = [];
    for (let i = 1; i <= pdf.numPages; i++) { const v = (await pdf.getPage(i)).getViewport({ scale: 1 }); sizes.push([v.width, v.height]); }
    meta.page_sizes = sizes;

    <div class="cFoot"><span class="kbd">⌘↵ 保存 · Esc 取消</span><button class="ghost c-cancel">取消</button><button class="primary c-save">保存</button></div>`;

// ------------------------------------------------------------------ drawing on pages

    const d = el("div", `hl ${it.kind === "region" ? "region" : ""} ${pending ? "pending" : st} ${focus ? "focus" : ""}`);
    d.dataset.id = it.id || "";

    pg.anno.append(d);

  if (pending) return;

// ------------------------------------------------------------------ persistence
const bkey = () => "paper-annotate:items:" + S.round.name;
function backup() { try { localStorage.setItem(bkey(), JSON.stringify(S.items)); } catch {} }
async function loadItems() {
  let server = [];
  try { server = (await (await fetch(`/api/r/${encodeURIComponent(S.round.name)}/annotations`)).json()).items || []; }
  catch { setSave("读不到服务端批注", "err"); }
  S.items = server;
  let local = [];
  try { local = JSON.parse(localStorage.getItem(bkey()) || "[]"); } catch {}
  let need = false;
  for (const l of local) {
    const s = S.items.find(x => x.id === l.id);
    if (!s) { S.items.push(l); need = true; continue; }
    if ((l.updated || "") > (s.updated || "")) { CLIENT_FIELDS.forEach(k => { if (k in l) s[k] = l[k]; }); need = true; }
    if ((l.status_at || "") > (s.status_at || "")) { s.status = l.status; s.status_at = l.status_at; need = true; }
  }
  if (need) scheduleSave(); else setSave(S.items.length ? `已载入 ${liveItems().length} 条` : "");
}
function applyServer(items) {
  let changed = false;
  for (const s of items) {
    const l = S.items.find(x => x.id === s.id);
    if (!l) { S.items.push(s); changed = true; continue; }
    for (const k of SERVER_FIELDS) if (JSON.stringify(l[k]) !== JSON.stringify(s[k])) { l[k] = s[k]; changed = true; }
    if ((s.updated || "") > (l.updated || "")) { CLIENT_FIELDS.forEach(k => { if (k in s) l[k] = s[k]; }); changed = true; }
    if ((s.status_at || "") > (l.status_at || "")) { l.status = s.status; l.status_at = s.status_at; changed = true; }
  }
  if (changed) { backup(); drawAnno(); renderList(); }
}
function scheduleSave() {

  setSave("待保存…");
}

  if (!S.dirty || !S.round) return;
  S.dirty = false;
  const name = S.round.name;
  setSave("保存中…");
  S.savePromise = (async () => {
    try {
      const r = await fetch(`/api/r/${encodeURIComponent(name)}/annotations`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ items: S.items }) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      if (S.round && S.round.name === name) applyServer(d.items || []);
      const t = new Date();
      setSave(`已保存 ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`, "ok");
    } catch (e) {

}

function wireSplitter() {

    document.documentElement.style.setProperty("--side-w", w + "px");
    return w;
  };
  try { const w = +localStorage.getItem("paper-annotate:side-w"); if (w) setSide(w); } catch {}

    const up = () => {
      sp.removeEventListener("pointermove", move);
      sp.classList.remove("drag"); document.body.classList.remove("resizing");
      clearTimeout(t); refit();
      if (w) try { localStorage.setItem("paper-annotate:side-w", String(w)); } catch {}
    };

  });

}
function wireUi() {
  wireSplitter();
  $("#roundSel").onchange = e => openRound(e.target.value);
  document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $("#zIn").onclick = () => setZoom(S.scale * 1.15);
  $("#zOut").onclick = () => setZoom(S.scale / 1.15);
  $("#zFit").onclick = () => setZoom(0, true);
  $("#copyMd").onclick = copyMd;
  $("#authorBtn").onclick = () => askAuthor();
  showAuthor();
  $("#exportBtn").onclick = async () => {
    if (!S.round) return;
    if (S.dirty || S.savePromise) await save();
    const a = el("a"); a.href = `/api/r/${encodeURIComponent(S.round.name)}/export`;
    a.download = `annotations-${S.round.name}${S.author ? "-" + S.author : ""}.json`;
    document.body.append(a); a.click(); a.remove();
  };
  $("#importBtn").onclick = () => $("#importFile").click();
  $("#importFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f || !S.round) return;
    if (S.dirty || S.savePromise) await save();
    try {
      const r = await fetch(`/api/import?round=${encodeURIComponent(S.round.name)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: await f.text() });
      const d = await r.json();
      if (d.error) { toast("导入失败：" + d.error); return; }
      if (d.round !== S.round.name) await openRound(d.round);
      else { await loadItems(); drawAnno(); renderList(); }
      toast(`导入 ${d.added} 条新批注${d.updated ? `，更新 ${d.updated} 条` : ""}` + (d.mismatch ? "（PDF 版本不同，位置可能有偏差）" : ""));
    } catch (err) { toast("导入失败：" + err.message); }
  };
  $("#addGlobal").onclick = () => {
    if (!ensureAuthor()) return;
    const now = isoNow();
    const it = { id: newId(), n: nextN(), kind: "global", page: 0, rects: [], quote: "", ctx: null, comment: "", tag: "",
      author: S.author, status: "open", status_at: now, created: now, updated: now, deleted: false };
    S.items.push(it); S.filter = "all"; startEdit(it.id); listEl.scrollTop = 0;
  };
  let scrollT;
  viewer.addEventListener("scroll", () => { clearTimeout(scrollT); scrollT = setTimeout(() => { if (!S.zooming) schedule(); updatePageInfo(); }, 60); });
  // 触控板双指捏合（Chrome/Edge/Firefox 发 ctrl+wheel）、Ctrl/⌘+滚轮：以光标为中心缩放
  viewer.addEventListener("wheel", e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const k = clamp(Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.15 : 0.01)), 0.8, 1.25);
    setZoom(S.scale * k, false, e.clientX, e.clientY);
  }, { passive: false });
  // Safari 的捏合手势
  let g0 = 1;
  viewer.addEventListener("gesturestart", e => { e.preventDefault(); g0 = S.scale; });
  viewer.addEventListener("gesturechange", e => { e.preventDefault(); setZoom(g0 * e.scale, false, e.clientX, e.clientY); });
  viewer.addEventListener("gestureend", e => e.preventDefault());
  window.addEventListener("resize", () => { if (S.fit) setZoom(0, true); });

  pagesEl.addEventListener("mousedown", e => {
    if (S.mode !== "text" || e.button !== 0) return;
    const tl = e.target.closest(".textLayer"); if (!tl) return;
    const pg = S.pages[+tl.parentElement.dataset.p - 1];
    if (e.altKey) { startRegion(e, pg); return; }
    if (e.detail > 1) clearTimeout(S.clickT);
    S.down = { x: e.clientX, y: e.clientY, pg };
    tl.classList.add("selecting");
  });
  document.addEventListener("mouseup", e => {
    document.querySelectorAll(".textLayer.selecting").forEach(t => t.classList.remove("selecting"));
    const d = S.down; S.down = null;
    if (!d) return;
    const moved = Math.hypot(e.clientX - d.x, e.clientY - d.y) > 4;
    const sel = window.getSelection();
    if (sel.rangeCount && !sel.isCollapsed && sel.toString().trim().length >= 2 && (moved || e.detail > 1)) {
      clearTimeout(S.clickT);
      onSelection(sel.getRangeAt(0));
      return;
    }
    if (!moved && e.detail === 1) {
      const shift = e.shiftKey, x = e.clientX, y = e.clientY;
      clearTimeout(S.clickT);
      S.clickT = setTimeout(() => onSentenceClick(d.pg, x, y, shift), 230);
    }
  });
  pagesEl.addEventListener("click", e => {
    if (e.target === pagesEl && S.pending && !composerText()) closeComposer();
  });
  document.addEventListener("keydown", e => {

      e.preventDefault();
      if (e.key === "0") setZoom(0, true);
      else setZoom(S.scale * (e.key === "-" || e.key === "_" ? 1 / 1.15 : 1.15));
      return;
    }
    const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") { if (S.pending) closeComposer(); else if (S.mode === "region") setMode("text"); else { S.focusId = null; drawAnno(); renderList(); } }
    else if (e.key === "r" || e.key === "R") setMode(S.mode === "region" ? "text" : "region");
    else if (e.key === "t" || e.key === "T") setMode("text");
    else if (e.key === "j") stepFocus(1);
    else if (e.key === "k") stepFocus(-1);
    else if (e.key === "+" || e.key === "=") setZoom(S.scale * 1.15);
    else if (e.key === "-") setZoom(S.scale / 1.15);
    else if (e.key === "0") setZoom(0, true);
    else if (e.key === "Enter" && S.focusId) { e.preventDefault(); startEdit(S.focusId); }

    e.preventDefault();
  });

}
boot();
